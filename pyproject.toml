[project]
name = "app-compare-image-tags"
version = "1.0.0"
description = "Compare Keboola component outputs between image tags"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "plotly>=5.18.0",
    "datacompy>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils", "page_modules"]
